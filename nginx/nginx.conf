upstream django {
    server app:8000;  # Points to the Django container
}

server {
    listen 80;
    server_name sujan-lamichhane.com.np www.sujan-lamichhane.com.np;  # Replace with your domain or VPS IP

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /static/;  # Serve static files directly
    }
}