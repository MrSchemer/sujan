version: '3.8'

services:
  app:
    build: .
    volumes:
      - .:/Sujan  # Mounts the project directory, including the SQLite file
    ports:
      - "8000:8000"
    environment:
      - DEBUG=0
      - DJANGO_SECRET_KEY=your-secret-key
      - DATABASE_URL=sqlite:///db.sqlite3  # SQLite path inside the container
    # No `depends_on` needed since there's no separate DB service

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./static:/static  # For serving static files
    depends_on:
      - app